<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ BossMenu Demo</title>
<link rel="stylesheet" href="html/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{display:block!important;background:#050812}</style>
</head>
<body>
<div class="boss-wrapper">
<aside class="sidebar">
<div class="logo"><i class="fa-solid fa-crown"></i></div>
<nav class="menu">
<button class="active" data-page="dashboard"><i class="fa-solid fa-house"></i></button>
<button data-page="finance"><i class="fa-solid fa-dollar-sign"></i></button>
<button data-page="employees"><i class="fa-solid fa-users"></i></button>
<button data-page="store"><i class="fa-solid fa-cart-shopping"></i></button>
<button data-page="vehicles"><i class="fa-solid fa-car"></i></button>
<button data-page="clothing"><i class="fa-solid fa-shirt"></i></button>
<button data-page="logs"><i class="fa-solid fa-file-lines"></i></button>
<button data-page="settings"><i class="fa-solid fa-gear"></i></button>
</nav>
</aside>
<main class="main">
<header class="header">
<div class="header-title"><h1 id="title">Dashboard</h1><p id="desc">Manage your job and employees.</p></div>
</header>
<section class="page active" id="dashboard"><div class="panel page-panel"><h2>Dashboard Page</h2></div></section>
<section class="page" id="finance"><div class="panel page-panel"><h2>Finance Page</h2></div></section>
<section class="page" id="employees"><div class="panel page-panel"><h2>Employees Page</h2></div></section>
<section class="page" id="store"><div class="panel page-panel"><h2>Store Page</h2></div></section>
<section class="page" id="vehicles"><div class="panel page-panel"><h2>Vehicles Page</h2></div></section>
<section class="page" id="clothing"><div class="panel page-panel"><h2>Clothing Page</h2></div></section>
<section class="page" id="logs"><div class="panel page-panel"><h2>Logs Page</h2></div></section>
<section class="page" id="settings"><div class="panel page-panel"><h2>Settings Page</h2></div></section>
</main>
</div>
<script>
const titles={dashboard:['Dashboard','Manage your job and employees.'],finance:['Finance','Manage society transactions.'],employees:['Employees','Manage employees and permissions.'],store:['Store','Manage store inventory.'],vehicles:['Vehicles','Manage job vehicles.'],clothing:['Clothing','Manage job outfits.'],logs:['Logs','Review all activities.'],settings:['Settings','Configure menu settings.']};
document.querySelectorAll('[data-page]').forEach(button=>{button.addEventListener('click',()=>{const page=button.dataset.page;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));document.getElementById(page).classList.add('active');button.classList.add('active');document.getElementById('title').innerText=titles[page][0];document.getElementById('desc').innerText=titles[page][1];});});
</script>
</body>
</html>
