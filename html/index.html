<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ BossMenu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-crown"></i>
            </div>

            <div class="menu">
                <button class="active"><i class="fa-solid fa-house"></i></button>
                <button><i class="fa-solid fa-dollar-sign"></i></button>
                <button><i class="fa-solid fa-users"></i></button>
                <button><i class="fa-solid fa-store"></i></button>
                <button><i class="fa-solid fa-car"></i></button>
                <button><i class="fa-solid fa-shirt"></i></button>
                <button><i class="fa-solid fa-file-lines"></i></button>
                <button><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <div class="main">
            <div class="header">
                <div>
                    <h1>Boss Menu</h1>
                    <p>Manage your organization</p>
                </div>

                <div class="profile">
                    <img src="https://i.imgur.com/3ZQ3Z6v.png">

                    <div>
                        <h3>John Smith</h3>
                        <span>Boss</span>
                    </div>

                    <div class="worktime">
                        <i class="fa-regular fa-clock"></i>
                        <span>23h 45m</span>
                    </div>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <i class="fa-solid fa-wallet"></i>
                    <h2>$45,250</h2>
                    <p>Balance</p>
                </div>

                <div class="card">
                    <i class="fa-solid fa-users"></i>
                    <h2>12</h2>
                    <p>Employees</p>
                </div>

                <div class="card">
                    <i class="fa-solid fa-car"></i>
                    <h2>8</h2>
                    <p>Vehicles</p>
                </div>
            </div>

            <div class="content-grid">
                <div class="panel logs"></div>

                <div class="panel info">
                    <h2>Job Information</h2>

                    <div class="info-row">
                        <span>Job Name</span>
                        <strong>Example Job</strong>
                    </div>

                    <div class="info-row">
                        <span>Grade</span>
                        <strong>Boss</strong>
                    </div>

                    <div class="info-row">
                        <span>Members</span>
                        <strong>12 / 50</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
