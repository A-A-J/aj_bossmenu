<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ BossMenu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="boss-wrapper">
        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-crown"></i></div>
            <nav class="menu">
                <button class="active" data-page="home"><i class="fa-solid fa-house"></i></button>
                <button data-page="finance"><i class="fa-solid fa-dollar-sign"></i></button>
                <button data-page="employees"><i class="fa-solid fa-users"></i></button>
                <button data-page="store"><i class="fa-solid fa-cart-shopping"></i></button>
                <button data-page="vehicles"><i class="fa-solid fa-car"></i></button>
                <button data-page="clothing"><i class="fa-solid fa-shirt"></i></button>
                <button data-page="logs"><i class="fa-solid fa-file-lines"></i></button>
                <button data-page="settings"><i class="fa-solid fa-gear"></i></button>
            </nav>
            <button class="exit-btn" id="closeBtn"><i class="fa-solid fa-right-from-bracket"></i></button>
        </aside>

        <main class="main">
            <header class="header">
                <div class="header-title">
                    <h1 id="pageTitle">Dashboard</h1>
                    <p id="pageDescription">Manage your job and employees.</p>
                </div>
                <div class="profile">
                    <img id="playerAvatar" src="https://i.imgur.com/3ZQ3Z6v.png">
                    <div class="profile-info">
                        <h3 id="playerName">John Smith</h3>
                        <span id="playerGrade"><i class="fa-solid fa-shield-halved"></i> Boss</span>
                    </div>
                    <div class="header-divider"></div>
                    <div class="worktime">
                        <i class="fa-regular fa-clock"></i>
                        <div><p>Work Time</p><span id="workTime">23h 45m</span></div>
                    </div>
                </div>
            </header>

            <section class="page active" id="homePage">
                <div class="cards"></div>
                <div class="content-grid">
                    <section class="panel logs-preview"><h2>Recent Logs</h2><div id="homeLogs"></div></section>
                    <section class="panel info"><h2>Job Information</h2><div id="jobInfo"></div></section>
                </div>
            </section>

            <section class="page" id="financePage"><div class="panel page-panel"><h2>Finance</h2><div class="finance-list"></div></div></section>
            <section class="page" id="employeesPage"><div class="panel page-panel"><h2>Employees</h2><div class="employees-list"></div></div></section>
            <section class="page" id="storePage"><div class="panel page-panel"><h2>Store</h2><div class="store-list"></div></div></section>
            <section class="page" id="vehiclesPage"><div class="panel page-panel"><h2>Vehicles</h2><div class="vehicles-list"></div></div></section>
            <section class="page" id="clothingPage"><div class="panel page-panel"><h2>Clothing</h2><div class="clothing-list"></div></div></section>
            <section class="page" id="logsPage"><div class="panel page-panel"><h2>Logs</h2><div class="logs-list"></div></div></section>
            <section class="page" id="settingsPage"><div class="panel page-panel"><h2>Settings</h2><div class="settings-list"></div></div></section>
        </main>
    </div>

    <div class="modal-overlay" id="appModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Modal Title</h2>
                <button id="modalClose"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="modal-content" id="modalBody"></div>

            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn save" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
